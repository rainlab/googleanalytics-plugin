# ===================================
#  Dashboard Definition
# ===================================

name: Google Analytics
icon: ph ph-google-logo
showInterval: false
permissions:
    - rainlab.googleanalytics.view_widgets

reports:
    traffic_overview:
        type: RainLab\GoogleAnalytics\ReportWidgets\TrafficOverview
        row: 1
        width: 20

    traffic_sources:
        type: RainLab\GoogleAnalytics\ReportWidgets\TrafficSources
        row: 2
        width: 10

    browsers:
        type: RainLab\GoogleAnalytics\ReportWidgets\Browsers
        row: 2
        width: 10

    top_pages:
        type: RainLab\GoogleAnalytics\ReportWidgets\TopPages
        row: 3
        width: 14

    traffic_goal:
        type: RainLab\GoogleAnalytics\ReportWidgets\TrafficGoal
        row: 3
        width: 6
