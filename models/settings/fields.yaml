# ===================================
#  Field Definitions
# ===================================

fields:
    gapi_key:
        span: left
        label: Private key
        type: fileupload
        commentAbove: The private key file you downloaded from Google API Console
        mode: file
        fileTypes: json

    profile_id:
        span: right
        label: Analytics Property ID number
        commentAbove: You can find it on the Google Analytics Admin / Property Settings page

tabs:
    fields:
        tracking_id:
            tab: Tracking
            span: left
            label: Measurement ID
            commentAbove: You can find the Measurement ID on the Admin / Property / Data Streams / Stream page

        domain_name:
            tab: Tracking
            span: right
            label: Domain name
            commentAbove: Specify the domain name you are going to track

        anonymize_ip:
            tab: Tracking
            type: switch
            span: left
            label: Anonymize IP
            commentAbove: Activate the IP anonymization for visitors

        force_ssl:
            tab: Tracking
            type: switch
            span: left
            label: Force SSL
            commentAbove: Always use SSL to send data to Google
